[project]
name = "python-setup"
version = "2.0.1"
description = "Automated python project setup tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27.1",
]

[project.scripts]
pyproj = "python_setup.setup:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = 'home-index'
url = "http://192.168.0.29:8080/simple/"
publish-url = "http://192.168.0.29:8080/"
explicit = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.33",
]
