[project]
name = "python-setup"
version = "1.0.0"
description = "Automated python project setup tool"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = 'home-index'
url = "http://192.168.0.29:8080/simple/"
publish-url = "http://192.168.0.29:8080/"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "ty>=0.0.33",
]
